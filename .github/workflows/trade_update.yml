name: Update Trade

on:
  workflow_dispatch:

concurrency:
  group: repository-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python3 trade_main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_INFO_DB_ID: ${{ secrets.NOTION_INFO_DB_ID }}
          NOTION_TRADE_DB_ID: ${{ secrets.NOTION_TRADE_DB_ID }}
          NOTION_NET_PROFIT_DB_ID: ${{ secrets.NOTION_NET_PROFIT_DB_ID }}
